[project]
name = "graph-trading-platform"
version = "0.1.0"
description = "Graph-based algorithmic trading research and paper-trading platform"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires internet access (deselect with '-m \"not network\"')",
    "slow: long-running test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # function call in default argument (used by pydantic Field)
    "RET504", # named variable before return aids debugging
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
# Pragmatic: strict where it pays, lenient where pandas typing fights back.
disallow_untyped_defs = false
check_untyped_defs = true
