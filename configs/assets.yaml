# Instrument universe.
#
# Nothing in the code hard-codes a symbol. Add an instrument here and the data
# layer, strategies, risk engine and backtester pick it up automatically.
#
# provider_symbols maps the canonical platform symbol to each vendor's ticker,
# so vendor naming never leaks into strategy code.
#
# has_reliable_volume MUST be false for OTC/spot instruments where the feed's
# "volume" is a broker tick count. Volume features are suppressed rather than
# computed on a meaningless series.

assets:
  XAUUSD:
    name: Gold / US Dollar
    asset_class: METAL
    quote_currency: USD
    base_currency: XAU
    provider_symbols:
      # NOTE: Yahoo does not publish a spot XAUUSD series. GC=F is COMEX
      # front-month gold futures, used here as the spot proxy. Its volume is
      # genuine exchange volume. See docs/data.md for the tracking-error
      # caveats (contract roll, basis, exchange hours vs 24h spot).
      # Swap in a true spot CSV via the `csv` provider and set
      # has_reliable_volume: false when you do.
      yahoo: "GC=F"
    tick_size: 0.01
    contract_size: 1.0
    typical_spread: 0.30
    commission_per_unit: 0.0
    venue_timezone: America/New_York
    has_reliable_volume: true
    trading_days: WEEKDAYS
    default_timeframe: 1D
    enabled: true
    # Surfaced on the dashboard and in paper-trading state. The comment above
    # explains the caveat to whoever reads this file; this field is what carries
    # it to whoever reads a result.
    is_proxy: true
    data_caveat: >-
      Prices come from Yahoo GC=F, COMEX front-month gold futures used as a proxy
      for spot XAUUSD. Yahoo publishes no spot gold series. The proxy differs from
      spot through contract roll, futures basis and exchange hours versus 24h spot
      trading, so levels and gaps are not true spot XAUUSD.

  EURUSD:
    name: Euro / US Dollar
    asset_class: FX
    quote_currency: USD
    base_currency: EUR
    provider_symbols:
      yahoo: "EURUSD=X"
    tick_size: 0.00001
    contract_size: 100000.0
    typical_spread: 0.00010
    commission_per_unit: 0.0
    venue_timezone: UTC
    has_reliable_volume: false   # OTC spot FX: no consolidated volume exists
    trading_days: WEEKDAYS
    default_timeframe: 1D
    enabled: true
    data_caveat: >-
      Yahoo's OTC FX feed is a sampled composite, not a traded series. Phase 1
      measured OHLC bound violations in a small percentage of bars. The data-quality
      engine grades every request and its verdict is authoritative; treat a WARNING
      grade here as a real limitation of the feed, not as noise to ignore.

  GBPUSD:
    name: British Pound / US Dollar
    asset_class: FX
    quote_currency: USD
    base_currency: GBP
    provider_symbols:
      yahoo: "GBPUSD=X"
    tick_size: 0.00001
    contract_size: 100000.0
    typical_spread: 0.00015
    commission_per_unit: 0.0
    venue_timezone: UTC
    has_reliable_volume: false
    trading_days: WEEKDAYS
    default_timeframe: 1D
    enabled: true
    data_caveat: >-
      Yahoo's OTC FX feed is a sampled composite, not a traded series, and phase 1
      measured OHLC bound violations in a small percentage of bars. The
      data-quality grade for each request is authoritative.

  USDJPY:
    name: US Dollar / Japanese Yen
    asset_class: FX
    quote_currency: JPY
    base_currency: USD
    provider_symbols:
      yahoo: "JPY=X"
    tick_size: 0.001
    contract_size: 100000.0
    typical_spread: 0.010
    commission_per_unit: 0.0
    venue_timezone: UTC
    has_reliable_volume: false
    trading_days: WEEKDAYS
    default_timeframe: 1D
    enabled: true
    # Yahoo publishes this pair as JPY=X, which is USD/JPY. The mapping is
    # correct but easy to misread, so it is stated where it will be seen.
    data_caveat: >-
      Sourced from Yahoo JPY=X (USD per JPY quote convention, i.e. USDJPY). OTC FX
      composite with the same bound-violation caveat as the other FX pairs; the
      data-quality grade for each request is authoritative.

  US30:
    name: Dow Jones Industrial Average
    asset_class: INDEX
    quote_currency: USD
    provider_symbols:
      yahoo: "^DJI"
    tick_size: 1.0
    contract_size: 1.0
    typical_spread: 2.0
    commission_per_unit: 0.0
    venue_timezone: America/New_York
    has_reliable_volume: true
    trading_days: WEEKDAYS
    default_timeframe: 1D
    enabled: true
    is_proxy: true
    data_caveat: >-
      ^DJI is the cash index, which is not itself tradable. A real US30 position
      would be a CFD or future whose price differs from the index through
      financing, dividends and extended trading hours.

  NASDAQ:
    name: Nasdaq Composite Index
    asset_class: INDEX
    quote_currency: USD
    provider_symbols:
      yahoo: "^IXIC"
    tick_size: 0.25
    contract_size: 1.0
    typical_spread: 1.0
    commission_per_unit: 0.0
    venue_timezone: America/New_York
    has_reliable_volume: true
    trading_days: WEEKDAYS
    default_timeframe: 1D
    enabled: true
    is_proxy: true
    data_caveat: >-
      ^IXIC is the Nasdaq Composite cash index and is not itself tradable. It is
      also a different basket from the Nasdaq-100 that most "NASDAQ" derivatives
      track, so results here do not transfer to an NQ or US100 instrument.
